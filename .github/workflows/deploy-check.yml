name: Production crawlability check

# Hits the LIVE public Railway URL with plain unauthenticated curl — no JS,
# no browser — from GitHub's own runners, which sit on a completely
# different network than Railway or any developer's machine. This is the
# genuine external-network verification that "it works in my browser" or
# "curl works from my laptop" can't provide: proof that a generic outside
# HTTP client (which is what a crawler is) can retrieve real content.
#
# Runs on a schedule so a regression (stale deploy, CDN/proxy issue,
# Railway config change) is caught even between pushes, and can be run
# on demand from the Actions tab (workflow_dispatch) right after a deploy.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to check'
        required: false
        default: 'https://hy2market-case-studies.up.railway.app'
  schedule:
    - cron: '17 */6 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check every published region on the live site
        env:
          BASE_URL: ${{ inputs.base_url || 'https://hy2market-case-studies.up.railway.app' }}
        run: ./scripts/check-deploy.sh "$BASE_URL"
